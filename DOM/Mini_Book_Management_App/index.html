<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management App</title>
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            min-height:100vh;
            align-items:center;
            justify-content: center;
            margin: 0;
            background: #f6f7fb;
        }
        .card{
            background: white;
            padding:28px;
            border-radius:10px;
            box-shadow: 0 6px 22px rgba(15,15,30,0.08);
            text-align:center;
            max-width: 420px;
            width:90%;
        }
        h1{
            margin:0 0 16px 0;
            font-size: 20px;
        }
        p{
            color:#555;
            margin-bottom: 20px;
        }
        a.button{
            display:inline-block;
            padding:10px 16px;
            background:#2563eb;
            color:white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card"role="main">
        <h1>Welcome to Book Management App</h1>
        <p>Manage a smal library:add,view,sort,filter and delete books from the admin page</p>
        <a href="admin.html"class="button"id="goAdmin">Go to Admin</a>
    </div>
</body>
<script>
    document.getElementById("goAdmin").addEventListener("click",function(e){

    });
</script>
</html>
